name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nullprotocol
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: nullprotocol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nullprotocol -d nullprotocol_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nullprotocol:test-password@localhost:5432/nullprotocol_test
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linter
      run: npm run lint
    
    - name: Check formatting
      run: npm run format:check
    
    - name: Run tests with coverage
      run: npm run test:ci
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.node-version == '20.x'
      with:
        files: ./coverage/lcov.info
        flags: unittests
        name: ai-toolkit-coverage
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Validate package
      run: npm run validate
    
    - name: Test build
      run: npm pack
    
    - name: Check package size
      run: |
        SIZE=$(stat -c%s *.tgz)
        echo "Package size: $SIZE bytes"
        if [ $SIZE -gt 1000000 ]; then
          echo "Package too large (>1MB)"
          exit 1
        fi
    
    - name: Test examples (smoke test)
      run: |
        echo "Testing examples with mock API..."
        npm run example:basic 2>&1 | grep -q "API" && echo "Example runs" || echo "Example needs API key"

  current-peers:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    - run: npm ci
    - run: npm install --no-save openai@latest @anthropic-ai/sdk@latest
    - run: npm test -- --runInBand
